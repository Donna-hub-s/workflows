name: workflows
version: 1.0.0
author: donna
description: >
  Automatisations de Donna (workflows) — recettes validées par l'utilisateur (déclencheur + étapes), exécutées
  seules à l'heure dite, avec journal d'exécutions et plafonds. Ce plugin possède les définitions, la
  planification et le journal ; tout ce qui demande Google, WhatsApp ou le modèle passe par les actions IPC
  du plugin chat (chat.workflow_read / summarize / agent / notify), qui gardent leurs garde-fous (compétences coupées,
  notification à soi seulement, données lues traitées comme non fiables). DONNA peut proposer un workflow,
  jamais l'activer : l'activation est un geste de l'utilisateur.

execution_mode: trusted
entry_point: src/main.py
framework_version: ">=2.0.0"

requires:
  - name: auth
    version: ">=1.0.0,<2.0.0"
  - name: chat
    version: ">=1.0.0,<2.0.0"

allowed_imports:
  - fastapi
  - typing
  - datetime
  - uuid
  - sqlalchemy
  - pydantic
  - zoneinfo
  - re
  - json
  - hashlib
  - asyncio
  - contextlib
  - dataclasses

# Vide = deny_all côté PermissionEngine (même piège que profile/xauth) : sans ce bloc, les appels IPC
# vers `workflows.*` (propose_workflow, côté chat) seraient refusés en silence.
permissions:
  - resource: "workflows.*"
    actions: ["*"]
    effect: "allow"

# ── RBAC — catalogue des actions IPC (voir profile/plugin.yaml pour la convention du format) ────────────────
rbac:
  grants: []  # aucune permission propre : chaque action porte sur les workflows DE l'appelant, jamais ceux d'un autre
  actions:
    - action: "workflows.propose"
      tier: users
      requires: []
      description: "Crée un brouillon de workflow pour l'appelant (scopé tenant_id/user_id du jeton) — jamais activé par cette action."
    - action: "workflows.activate"
      tier: users
      requires: []
      description: >
        Active un brouillon PROPOSÉ par DONNA, appelée uniquement quand l'UTILISATEUR confirme via l'interface —
        exige `expected_hash` (empreinte vue et approuvée) : le geste d'activation lui-même est la garantie, pas
        une permission RBAC supplémentaire.
    - action: "workflows.discard"
      tier: users
      requires: []
      description: "Archive un brouillon non approuvé (refus de l'utilisateur) — ne touche jamais un workflow déjà actif."
    - action: "workflows.list"
      tier: users
      requires: []
      description: "Liste les workflows DE l'appelant."
      # Exposée comme tool d'un sous-agent (extensions/ipc_bridge, voir profile.get pour le premier essai) :
      # workflows est un plugin MÉTIER (pas de l'infra comme xauth/xpulses), seconde preuve du mécanisme sur un
      # plugin séparé. Paramètres/permissions/risque résolus depuis schema_registry (@action/@schema sur
      # _ipc_list, app/workflows/src/ipc.py) — jamais dupliqués ici. propose/activate/discard restent HORS de
      # cet agent : propose a besoin du wrapping pending-action, activate est un geste humain exclusif
      # (AGENTS.md), discard n'a pas d'usage identifié comme tool modèle.
      agent: "workflow_manager"
      agent_description: "consulte et met en pause les workflows (automatisations) de l'utilisateur."
    - action: "workflows.pause"
      tier: users
      requires: []
      description: "Met en pause un workflow DE l'appelant — retirer une capacité ne demande pas d'approbation ni de permission élevée."
      agent: "workflow_manager"

resources:
  timeout_seconds: 30
  max_memory_mb: 256

runtime:
  health_check:
    enabled: true
    interval_seconds: 60
